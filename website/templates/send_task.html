{% extends 'base.html' %}

{% block title %}Отправить заявку{% endblock %}

{% block content %}
<section class="send-task-section">
  <header>
    <h1>Отправить новую заявку</h1>
    <p>Опишите проблему и укажите координаты для быстрого решения</p>
  </header>

  <div class="send-task-form">
    {% if message %}
    <div class="alert alert-danger" role="alert">
      {{ message }}
    </div>
    {% endif %}

    <form method="POST" class="task-form">
      <div class="form-group">
        <label for="coordinates">Координаты</label>
        <input type="text" class="form-control" id="coordinates" name="coordinates"
          placeholder="Введите координаты (например, 51.1694, 71.4491)" required />
        <small class="form-text text-muted">Укажите координаты точки проблемы</small>
      </div>

      <div class="form-group">
        <label for="description">Описании проблемы</label>
        <textarea class="form-control" id="description" name="description" rows="5"
          placeholder="Опишите проблему подробно..." required></textarea>
      </div>

      <button type="submit" class="btn btn-primary btn-lg">Отправить заявку</button>
      <a href="{{ url_for('views.home') }}" class="btn btn-secondary btn-lg">Отмена</a>
    </form>
  </div>
</section>
{% endblock %}
